[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fold"
version = "0.2.0"
description = "Fold: llama.cpp Agent Fleet Orchestrator & Herdr Workspace Integration"
readme = "README.md"
authors = [{ name = "Sachsen", email = "sachsen@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.0",
]

[project.scripts]
fold = "fold.cli:main"
sheprd = "fold.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fold*"]

[tool.setuptools.package-data]
fold = [
    "web/templates/*.html",
    "web/static/css/*.css",
    "web/static/js/*.js",
    "web/static/img/*",
]
